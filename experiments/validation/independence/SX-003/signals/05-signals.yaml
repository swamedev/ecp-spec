## Resumo da Etapa 5

| Signal | Afirmação | Ocorrências independentes | independente | status |
|---|---|---|---|---|
| SIG-003 | Cadeia emerge sem vocabulário ECP | 3 (Challenger, Ebola, Genoma) | true | signal — admissível (RA-SIG-001 satisf.; 3 origens) |
| SIG-005 | Presença ex-ante em sucesso (candidato) | 1 (Genoma) | true* | candidato — não admissível (RA-SIG-001: 1 ocorrência) |
| SIG-001 | Decisão justificável requer conhecimento | 2 (não alterado por 003) | true | permanece (neste experimento não adiciona ocorrência) |
| SIG-002 | Ausência de infraestrutura cognitiva observável em crises | 2 — Ch/EB | true | permanece; **não** contradito; recebe corolário (ver nota) |
| SIG-004 | Lag alerta→coordenação | 1 (Ebola) | false | candidato (não admissível; intocado pelo 003) |

> *independente: o SX-003 é origem causal distinta, mas o número de casos de
> sucesso = 1, logo é *independente* mas *insuficiente* (não admissível).

> **IMPORTANTE — estado da RA-SIG-001 após o SX-003:**
> - **SIG-003** agora tem **3 origens independentes** (Challenger, Ebola,
>   Genoma — três domínios diferentes). Cada ocorrência independente e com
>   manifestação própria. Ainda **sem promoção a `pattern`** (RA-SIG-005).
> - **SIG-002** recebe um **corolário**: a predição **inversa** (casos de
>   sucesso têm as entidades **presentes**) ganhou apoio no SX-003; mas o candidato
>   SIG-005 precisa de 2.ª ocorrência de sucesso. Não é conclusão.
> - **SIG-001/SIG-004** não alterados pelo SX-003.

