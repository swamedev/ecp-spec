> em origens causalmente independentes (RA-EI-003). O SX-003 é origem causal
> **independente** das anteriores (Genoma Humano — Pesquisa Científica; público
> NHGRI/DOE + revisão de pares + Celera).
>
> **Alegação de honestidade (como nos anteriores):** não se busca convergência
> forçada. O SX-003 é o **primeiro caso de sucesso**; a divergência com os casos
> de crise também é dado. Cada Signal distingue o que é apoiado em ambos os
> casos do que muda num sucesso.
