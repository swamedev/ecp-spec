> **Nenhum signal promovido a `pattern`** (RA-SIG-005); consolidação v1.1 é
> fora do escopo congelado. Aqui se registra a ocorrência **adicional** do
> SX-003, sem alterar schema.

## Signals suportados pelo Alignment

### SIG-003 — Cadeia cognitiva emerge sem o vocabulário ECP (3ª ocorrência independente)

```yaml
id: SIG-003
afirmacao: Em um projeto sem qualquer exposição ao ECP, a cadeia
  Goal -> Knowledge -> Lacuna -> Assumption -> Evidence -> Decision ->
  Execution -> Validation -> Learning emerge a partir apenas dos fatos
  observados.
kind_base: structural
ocorrencias:
  - EXP-SX001   # Challenger: cadeia emergente com elo quebrado Evidence->Decision
  - EXP-SX002   # Ebola: cadeia emergente com defasagem (lag) alerta->coordenação
  - EXP-SX003   # Genoma Humano: cadeia emergente completa; risco formal ausente (tratado por governança ELSI)
confianca: 0.70    # 3ª ocorrência; domínio novo (Pesquisa Científica); manifestação distinta
dominios:
  - Aeroespacial
  - Saúde Pública
  - Pesquisa Científica        # novo domínio
contraexemplos: 0
evidencia_base:
  - SX001-Em — emergência espontânea (§5)
  - SX002-Em — emergência espontânea (§5)
  - SX003-Em — emergência espontânea (§5) + Alignment item 19/20 (peer reviewed)
independente: true
status: signal
admissivel_ra_sig_001: true    # >=2 origens causalmente independentes; agora 3
nota: |
  No sucesso (HGP) a cadeia emerge COMPLETA, sem ruptura Evidence->Decision e
  sem lag: as decisões formais antecedem os marcos de evidência. Isto reforça a
  tese de que a cadeia é ESTRUTURA (o esqueleto emerge) — e a forma (onde ela
  fratura) varia com o caso. O caso de sucesso torna a promoção a pattern ainda
  mais plausível, mas a consolidação é da v1.1.
```

### SIG-005 — Presença ex-ante de Goal/Problem e projeção diferencia o sucesso (candidato novo)

```yaml
id: SIG-005
afirmacao: Em casos com desfecho de sucesso, o registro mostra a PRESENÇA explícita
  de Goal e Problem definidos e de uma projeção de prazo/custo antes da execução;
  em casos de crise, essas entidades são AUSENTES ou pós-hoc.
kind_base: comparative
ocorrencias:
  - EXP-SX003     # Genoma: Goal/Problem ex-ante (AF-005/006, AF-047), prazo 15 anos (AF-011), custo (AF-012)
confianca: 0.35    # 1 ocorrência (SX-003); predição inversa — aguarda 2ª ocorrência de sucesso
dominios:
  - Pesquisa Científica
contraexemplos: 0
evidencia_base:
  - SX003-Em (§5 Goal/Problem ex-ante) + SX003-ALIGN (MATCH itens 4/6)
independente: true # origem causal independente (não-EBP); mas único caso de sucesso
status: candidate
admissivel_ra_sig_001: false   # apenas 1 ocorrência — não admissível ainda
nota: |
  O SX-003 é o PRIMEIRO caso de sucesso. A predição inversa de SIG-002 ("a
  ausência em crises deve virar presença em sucessos") aparece aqui apoiada.
  Requer mais um caso de sucesso (OWS apontado no pré-registro) para ser
  admissível. NÃO é promovido agora.
```

