## Resumo da Etapa 5

| Signal | Afirmação | Ocorrências independentes | independente | status |
|---|---|---|---|---|
| SIG-001 | Decisão justificável requer conhecimento (no tempo) | 2 (Challenger, Ebola) | true | signal — admissível (RA-SIG-001 satisfeita) |
| SIG-002 | Ausência de infraestrutura cognitiva observável | 2 (Challenger, Ebola) | true | signal — admissível, ressalva amostral |
| SIG-003 | Cadeia emerge sem vocabulário ECP | 2 (Challenger, Ebola) | true | signal — admissível |
| SIG-004 | Lag alerta→coordenação observável (candidato) | 1 (Ebola) | false | candidato (não admissível) |

> **IMPORTANTE — estado da RA-SIG-001:** com o SX-002, **3 Signals preenchem o
> requisito mínimo de ≥2 origens causalmente independentes.** Ainda assim,
> **nenhum é promovido a `pattern`** (RA-SIG-005): a promoção depende dos
> critérios objetivos do [README da frente](../../README.md) (corpus, requesitos,
> OBS reconstruíveis) e da consolidação formal da v1.1 — **fora** do escopo
> congelado deste experimento.
>
> **Divergência registrada como DADO (não buscada):** entre SX-001 e SX-002 o
> padrão de manifestação difere (elo quebrado × lag temporal). Convergência da
> cadeia não é convergência de exito. Isso indica: o ECP prevê a estrutura;
> a forma da falha varia com contexto. A distinção fica na análise, não dentro
> do Kernel.

