## Resumo da Etapa 5

| Signal | Afirmação | Ocorrências | independente | status |
|---|---|---|---|---|
| SIG-001 | Decisão justificável depende de conhecimento | 3 (1 externa real) | true | signal (admissível pendente v1.1) |
| SIG-002 | Ausência de estruturas do Kernel é observável | 1 | false | candidato |
| SIG-003 | Cadeia emerge sem vocabulário ECP | 1 | false | candidato |

> Nenhum signal foi promovido a pattern (RA-SIG-005). O Challenger é **1
> ocorrência independente**. A consolidação (confiança final, promoção) é adiada
> para a calibração v1.1 — **fora** do escopo congelado do experimento.

