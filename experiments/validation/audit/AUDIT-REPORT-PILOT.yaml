verificacao_ra_obs:
  RA-OBS-001: 16/16 fatos verificaveis; OBS-0016 identificada como caso canonico de violacao (derived) — nao admissivel no
    corpus primario.
  RA-OBS-002: 16/16 com evidence + trace presentes.
  RA-OBS-003: 16/16 reconstruiveis pelos artefatos do experimento.
  RA-OBS-004: 16/16 com confidence_source presente.
  RA-OBS-005: 13 OBS preservam informacao essencial (10 essenciais + 3 parciais).
  RA-OBS-006: 16/16 com kind classificado.
  RA-OBS-007: observation_profile presente (0.75 / 0.1875 / 0.0625).
ambiguidades_encontradas:
- Chaves compostas em trace (source-label-target) com IDs contendo hifen (G-0001) quebraram o parsing inicial do instrumento
  — fragilidade da ferramenta, corrigida.
- 'OBS-0016 (derived) e um "falso positivo": aparenta observacao, viola RA-OBS-001. O instrumento precisa trata-la explicitamente
  como caso canonico.'
- Concordancia inter-humana nao mensuravel no piloto (falta segundo avaliador humano).
ajustes_protocolo:
- 'auditor.py: reconstrucao de arestas por chave composta exata, nao por parsing de IDs com hifen.'
- 'ECP-AUDIT-001 §5.2: criterios objetivos explicitos para kind (necessidade relacional, independencia de implementacao, impacto
  causal).'
- 'ECP-AUDIT-001 §9: veredito PASS_COM_RESSALVAS para corpus com OBS derived identificada.'
- 'ECP-AUDIT-001 §7: limiares de concordancia declarados ajustaveis ate medicao com avaliadores humanos.'
conclusao:
  veredito_piloto: PASS (protocolo reproduzivel e objetivo dentro do escopo avaliado)
  corpus_certificado: false
  protocolo_certificado: true
  proximo_passo: Medir concordancia inter-humana (kappa) na auditoria oficial com dois avaliadores independentes; entao aplicar
    o gate ao corpus.
