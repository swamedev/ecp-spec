## Observações adicionais

- **Sem campos extras:** O schema deve conter **APENAS** os campos listados acima.
- **Identificadores estáveis:** Use o mesmo identificador OBS em todo o corpus (ex.: OBS-0001 nunca muda).
- **Garantia de reprodutibilidade:** `trace` deve ser uma referência concreta (linha de arquivo, hash, URL) que permita a outro avaliador localizar a evidência exata.

**Nota:** Campos opcionais são listados para documentação futura; não são atualmente obrigatórios para um OBS válido.

## Princípio da Conservação da Informação (Princípio central do Validation Program)

> Cada transformação realizada pelo Validation Program deve preservar toda a informação essencial da etapa anterior.

**Observação:** Este princípio pode ser expandido em um **LAW-H** futuro: "Toda abstração produzida pelo ECP deve ser auditável contra sua fonte."

