## Admissibilidade

Conforme [RA-SIG](../signals/SIGNAL-SCHEMA.yaml):

- **RA-SIG-001** — requer ≥ 2 ocorrências em experimentos **independentes**.
- **RA-SIG-003** — ocorrências de origem não independente **não contam** como
  independentes (registradas separadamente).

Portanto: EXP-001 e H-001 compartilham autores/programa → **não são
independentes** → nenhum Signal abaixo satisfaz RA-SIG-001 plenamente ainda.
São registrados como **candidatos preliminares**, aguardando ocorrência em
experimento independente (ex.: EXP-002/ERP com avaliador externo).

